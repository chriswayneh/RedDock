worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    # Fixed labels retain request metrics without storing paths, query strings,
    # client addresses, headers, cookies, or attacker-selected method text.
    map $uri $reddock_route {
        default other;
        ~^/api/auth/ authentication;
        ~^/api/ api;
        ~^/assets/ static;
        / application;
    }
    map $request_method $reddock_method {
        default OTHER;
        GET GET;
        HEAD HEAD;
        POST POST;
        PUT PUT;
        PATCH PATCH;
        DELETE DELETE;
        OPTIONS OPTIONS;
    }
    log_format reddock_safe escape=json
        '{"time":"$time_iso8601","route":"$reddock_route",'
        '"method":"$reddock_method","status":$status,'
        '"bytes":$body_bytes_sent,"duration_seconds":$request_time}';
    access_log /dev/stdout reddock_safe;
    # Nginx request-error messages can append the raw request URI. Keep master
    # startup diagnostics above, but use status metrics for HTTP failures.
    error_log /dev/null;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        client_max_body_size 2m;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_buffering off;
            proxy_pass http://unix:/run/reddock-api/reddock.sock;
        }
    }
}
