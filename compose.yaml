services:
  reddock:
    build:
      context: .
    command: ["python", "-m", "app.compose_socket", "serve"]
    user: "999:999"
    environment:
      REDDOCK_DATABASE_URL: sqlite:////var/lib/reddock/reddock.db
      # Discovery evidence lives beside the database in the same named volume.
      REDDOCK_EVIDENCE_DIR: /var/lib/reddock/evidence
      REDDOCK_OPERATOR_TOKEN_FILE: /var/lib/reddock/operator-token
      # Optional local developer surface; does not add authentication.
      REDDOCK_API_DOCS_ENABLED: ${REDDOCK_API_DOCS_ENABLED:-false}
    volumes:
      - reddock-data:/var/lib/reddock
      - reddock-api-socket:/run/reddock-api
    networks:
      - reddock-ingress
      - reddock-outbound
    # The image already runs as an unprivileged user, and TCP-connect scanning
    # needs no capabilities, so nothing has to be granted back here.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    init: true
    pids_limit: 256
    mem_limit: 1g
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-m", "app.compose_socket", "check"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  reddock-ingress:
    image: nginxinc/nginx-unprivileged:1.29.1-alpine@sha256:27985295bdb22a1ef8f712863210bd5877c0f3006494a593e86b3fe0fa55467e
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    ports:
      # This is the only TCP ingress. The application itself listens on a Unix socket.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - reddock-api-socket:/run/reddock-api:ro
    networks:
      - reddock-ingress
    depends_on:
      reddock:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=33554432,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 64
    mem_limit: 128m
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  reddock-data:
  reddock-api-socket:

networks:
  reddock-ingress:
  reddock-outbound:
