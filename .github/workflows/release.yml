name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/chriswayneh/reddock

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.metadata.outputs.phase }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the release branch boundary
        run: git fetch --no-tags origin master
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: metadata
        name: Verify the annotated tag and release metadata
        run: python scripts/verify_release.py "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Verify the backend
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          pip-audit --progress-spinner off .
          ruff check app tests
          pytest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run security:deps
          npm audit --audit-level=high
          npm run lint
          npm run check
          npm test
          npm run build
      - name: Verify the production container
        env:
          REDDOCK_EXPECT_PLUGIN: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/reddock-release-detectors"
          cp plugins/examples/example-server.json.example "$RUNNER_TEMP/reddock-release-detectors/example-server.json"
          docker build -t reddock:release .
          docker run -d --name reddock-release -p 127.0.0.1:8080:8080 \
            -e REDDOCK_LAB_MODE_ENABLED=true \
            -e REDDOCK_DETECTOR_PLUGIN_DIR=/etc/reddock/detectors \
            -v "$RUNNER_TEMP/reddock-release-detectors:/etc/reddock/detectors:ro" \
            reddock:release
          trap 'docker logs reddock-release; docker rm -f reddock-release' EXIT
          for attempt in {1..12}; do
            curl --fail http://localhost:8080/api/ready && break
            if [ "$attempt" = 12 ]; then exit 1; fi
            sleep 2
          done
          python3 scripts/smoke_test.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and publish AMD64 and ARM64 images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest the published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PHASE: ${{ needs.verify.outputs.phase }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --generate-notes
          --title "RedDock $GITHUB_REF_NAME - $RELEASE_PHASE"
