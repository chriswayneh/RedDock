name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/chriswayneh/reddock

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.metadata.outputs.phase }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the release branch boundary
        run: git fetch --no-tags origin master
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: metadata
        name: Verify the annotated tag and release metadata
        run: python scripts/verify_release.py "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Verify the backend
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          pip-audit --progress-spinner off .
          ruff check app tests ../scripts/verify_release.py ../scripts/smoke_test.py
          pytest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run security:deps
          npm audit --audit-level=high
          npm run lint
          npm run check
          npm test
          npm run build
      - name: Verify the production container
        env:
          REDDOCK_EXPECT_PLUGIN: "true"
          REDDOCK_SMOKE_TARGET: reddock-ingress
          REDDOCK_SMOKE_ORIGIN: http://reddock-ingress:8080
        run: |
          mkdir -p "$RUNNER_TEMP/reddock-release-detectors"
          cp plugins/examples/example-server.json.example "$RUNNER_TEMP/reddock-release-detectors/example-server.json"
          docker build -t reddock:release .
          docker run --rm --entrypoint sh reddock:release -c '
            test -r /usr/share/doc/reddock/THIRD_PARTY_NOTICES.md &&
            test -r /usr/share/doc/reddock/NMAP_SOURCE_OFFER.md &&
            cd /usr/share/reddock-source/nmap && sha256sum -c SHA256SUMS &&
            cat PACKAGE.txt && nmap --version
          '
          cat > "$RUNNER_TEMP/compose-release.yaml" <<YAML
          services:
            reddock:
              image: reddock:release
              pull_policy: never
              environment:
                REDDOCK_LAB_MODE_ENABLED: "true"
                REDDOCK_DETECTOR_PLUGIN_DIR: /etc/reddock/detectors
              volumes:
                - $RUNNER_TEMP/reddock-release-detectors:/etc/reddock/detectors:ro
          YAML
          compose=(docker compose -p reddock-release -f compose.yaml -f "$RUNNER_TEMP/compose-release.yaml")
          cleanup() {
            "${compose[@]}" logs --no-color 2>&1 | sed -E \
              's/(First-start local operator token \(shown once\):).*/\1 [REDACTED]/' || true
            "${compose[@]}" down -v --remove-orphans || true
          }
          trap cleanup EXIT
          "${compose[@]}" up -d --no-build
          for attempt in {1..12}; do
            curl --fail http://localhost:8080/api/ready && break
            if [ "$attempt" = 12 ]; then exit 1; fi
            sleep 2
          done
          "${compose[@]}" exec -T reddock test -S /run/reddock-api/reddock.sock
          REDDOCK_OPERATOR_TOKEN="$("${compose[@]}" exec -T reddock cat /var/lib/reddock/operator-token)"
          echo "::add-mask::$REDDOCK_OPERATOR_TOKEN"
          export REDDOCK_OPERATOR_TOKEN
          python3 scripts/smoke_test.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and publish AMD64 and ARM64 images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest the published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Extract matching Nmap source from each published architecture
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          image_index="$(docker buildx imagetools inspect --raw "$image_ref")"
          for architecture in amd64 arm64; do
            platform_digest="$(
              jq -r --arg architecture "$architecture" '
                [
                  .manifests[]
                  | select(
                      .platform.os == "linux"
                      and .platform.architecture == $architecture
                    )
                ]
                | if length == 1 then .[0].digest else empty end
              ' <<<"$image_index"
            )"
            if [[ ! "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Could not resolve one immutable linux/$architecture manifest" >&2
              exit 1
            fi
            platform_ref="${IMAGE_NAME}@${platform_digest}"
            source_dir="$RUNNER_TEMP/nmap-source-$architecture"
            mkdir -p "$source_dir"
            docker pull "$platform_ref"
            container_id="$(docker create --platform "linux/$architecture" \
              "$platform_ref")"
            docker cp "$container_id:/usr/share/reddock-source/nmap/." \
              "$source_dir/" || {
                docker rm -f "$container_id"
                exit 1
              }
            docker rm "$container_id"
            printf 'image=%s\nplatform=linux/%s\nmanifest=%s\nplatform_manifest=%s\n' \
              "$image_ref" "$architecture" \
              '${{ steps.build.outputs.digest }}' "$platform_digest" \
              > "$source_dir/REDDOCK_IMAGE.txt"
            tar -C "$RUNNER_TEMP" -czf \
              "$RUNNER_TEMP/reddock-nmap-source-$architecture.tar.gz" \
              "nmap-source-$architecture"
          done
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PHASE: ${{ needs.verify.outputs.phase }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "RedDock $GITHUB_REF_NAME - $RELEASE_PHASE" \
            "$RUNNER_TEMP/reddock-nmap-source-amd64.tar.gz" \
            "$RUNNER_TEMP/reddock-nmap-source-arm64.tar.gz" \
            THIRD_PARTY_NOTICES.md \
            docs/NMAP_SOURCE_OFFER.md
