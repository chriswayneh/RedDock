name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate core and optional local-AI Compose packages
        env:
          REDDOCK_POSTGRES_PASSWORD: compose-validation-only
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.ollama.yaml config --format json > "$RUNNER_TEMP/compose-ai.json"
          docker compose -f compose.yaml -f compose.postgres.yaml config --format json > "$RUNNER_TEMP/compose-postgres.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          document = json.loads(Path(os.environ["RUNNER_TEMP"], "compose-ai.json").read_text())
          services = document["services"]
          assert services["reddock"]["environment"]["REDDOCK_LLM_MODEL"] == "qwen3.5:4b"
          assert services["reddock"]["environment"]["REDDOCK_LLM_BASE_URL"] == "http://ollama:11434/v1"
          assert "ports" not in services["ollama"]
          assert "@sha256:" in services["ollama"]["image"]
          assert services["ollama-model"]["command"] == ["pull", "qwen3.5:4b"]

          postgres_document = json.loads(
              Path(os.environ["RUNNER_TEMP"], "compose-postgres.json").read_text()
          )
          postgres = postgres_document["services"]["postgres"]
          assert "ports" not in postgres
          assert postgres["image"].startswith("postgres:17.11-bookworm@sha256:")
          assert postgres["environment"]["POSTGRES_PASSWORD_FILE"] == (
              "/run/secrets/reddock-postgres-password"
          )
          reddock = postgres_document["services"]["reddock"]
          assert reddock["environment"]["REDDOCK_DATABASE_HOST"] == "postgres"
          assert reddock["environment"]["REDDOCK_DATABASE_PASSWORD_FILE"] == (
              "/run/secrets/reddock-postgres-password"
          )
          assert "REDDOCK_POSTGRES_PASSWORD" not in str(postgres_document["services"])
          PY
      - run: docker build -t reddock:ci .
      - name: Prepare reviewed data-only detector manifest
        run: |
          mkdir -p "$RUNNER_TEMP/reddock-detectors"
          cp plugins/examples/example-server.json.example "$RUNNER_TEMP/reddock-detectors/example-server.json"
      - name: Start the production image with Phase 7 test gates
        run: |
          docker run -d --name reddock -p 8080:8080 \
            -e REDDOCK_LAB_MODE_ENABLED=true \
            -e REDDOCK_DETECTOR_PLUGIN_DIR=/etc/reddock/detectors \
            -v "$RUNNER_TEMP/reddock-detectors:/etc/reddock/detectors:ro" \
            reddock:ci
      - name: Wait for the health endpoint
        run: for attempt in {1..12}; do curl --fail http://localhost:8080/api/health && exit 0; sleep 2; done; exit 1
      - name: Full product smoke test
        # Both discovery profiles scan the container's own loopback only.
        env:
          REDDOCK_EXPECT_PLUGIN: "true"
        run: python3 scripts/smoke_test.py
      - if: always()
        run: docker logs reddock

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_DB: reddock
          POSTGRES_USER: reddock
          POSTGRES_PASSWORD: integration-only
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reddock -d reddock"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Prove migrations and CRUD against PostgreSQL
        env:
          REDDOCK_TEST_POSTGRES_URL: postgresql+psycopg://reddock:integration-only@127.0.0.1:5432/reddock
        run: pytest tests/test_postgres.py
