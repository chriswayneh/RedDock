name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pip-audit --progress-spinner off .
      - run: ruff check app tests ../scripts/verify_release.py
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run security:deps
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build

  container:
    name: container (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: AMD64
            runner: ubuntu-latest
          - architecture: ARM64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate core and optional local-AI Compose packages
        env:
          REDDOCK_POSTGRES_PASSWORD: compose-validation-only
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.ollama.yaml config --format json > "$RUNNER_TEMP/compose-ai.json"
          docker compose -f compose.yaml -f compose.postgres.yaml config --format json > "$RUNNER_TEMP/compose-postgres.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          document = json.loads(Path(os.environ["RUNNER_TEMP"], "compose-ai.json").read_text())
          services = document["services"]
          assert services["reddock"]["environment"]["REDDOCK_LLM_MODEL"] == "qwen3.5:4b"
          assert services["reddock"]["environment"]["REDDOCK_LLM_BASE_URL"] == "http://ollama:11434/v1"
          assert "ports" not in services["ollama"]
          assert "@sha256:" in services["ollama"]["image"]
          assert services["ollama-model"]["command"] == ["pull", "qwen3.5:4b"]

          postgres_document = json.loads(
              Path(os.environ["RUNNER_TEMP"], "compose-postgres.json").read_text()
          )
          postgres = postgres_document["services"]["postgres"]
          assert "ports" not in postgres
          assert postgres["image"].startswith("postgres:17.11-bookworm@sha256:")
          assert postgres["environment"]["POSTGRES_PASSWORD_FILE"] == (
              "/run/secrets/reddock-postgres-password"
          )
          reddock = postgres_document["services"]["reddock"]
          assert reddock["environment"]["REDDOCK_DATABASE_HOST"] == "postgres"
          assert reddock["environment"]["REDDOCK_DATABASE_PASSWORD_FILE"] == (
              "/run/secrets/reddock-postgres-password"
          )
          assert "REDDOCK_POSTGRES_PASSWORD" not in str(postgres_document["services"])
          PY
      - run: docker build -t reddock:ci .
      - name: Verify the stable unprivileged image identity
        run: >-
          docker run --rm --entrypoint sh reddock:ci -c
          'test "$(id -u reddock)" = 999 && test "$(id -g reddock)" = 999'
      - name: Validate offline SQLite maintenance and recovery
        if: matrix.architecture == 'AMD64'
        env:
          REDDOCK_MAINTENANCE_IMAGE: reddock:ci
          REDDOCK_BACKUP_DIR: ${{ runner.temp }}/reddock-backups
        run: |
          set -euo pipefail
          export REDDOCK_MAINTENANCE_UID="$(id -u)"
          project=reddock-maintenance-ci
          ready_container="${project}-ready"
          compose=(docker compose -p "$project" --profile maintenance -f compose.yaml -f compose.maintenance.yaml)
          mkdir -m 700 -p "$REDDOCK_BACKUP_DIR"

          "${compose[@]}" config --format json > "$RUNNER_TEMP/compose-maintenance.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          document = json.loads(
              Path(os.environ["RUNNER_TEMP"], "compose-maintenance.json").read_text()
          )
          services = document["services"]
          names = ("reddock-backup", "reddock-verify", "reddock-restore", "reddock-recover")
          for name in names:
              service = services[name]
              assert service["network_mode"] == "none"
              assert service["read_only"] is True
              assert service["cap_drop"] == ["ALL"]
              assert "no-new-privileges:true" in service["security_opt"]
              assert service["pids_limit"] == 32
              assert service["restart"] == "no"
              assert "ports" not in service
              assert any(
                  "mode=1777" in item and "size=8589934592" in item
                  for item in service["tmpfs"]
              )
          assert services["reddock-backup"]["user"] == f"{os.getuid()}:999"
          assert services["reddock-verify"]["user"] == f"{os.getuid()}:999"
          assert services["reddock-restore"]["user"] == "999:999"
          assert services["reddock-recover"]["user"] == "999:999"

          def mount(service, target):
              return next(item for item in service["volumes"] if item["target"] == target)

          assert mount(services["reddock-backup"], "/var/lib/reddock")["read_only"]
          assert not mount(services["reddock-backup"], "/backups").get("read_only", False)
          assert mount(services["reddock-verify"], "/backups")["read_only"]
          assert mount(services["reddock-restore"], "/backups")["read_only"]
          assert not mount(services["reddock-restore"], "/var/lib/reddock").get(
              "read_only", False
          )
          PY

          cleanup() {
            docker logs "$ready_container" 2>/dev/null || true
            docker rm -f "$ready_container" 2>/dev/null || true
            "${compose[@]}" down -v --remove-orphans || true
          }
          trap cleanup EXIT

          "${compose[@]}" run --rm --no-deps --entrypoint python reddock-recover \
            -c "from app.database import initialize_database; initialize_database()"
          "${compose[@]}" run --rm --no-deps --entrypoint sh reddock-backup \
            -c 'test -w /tmp && test "$(stat -c %a /tmp)" = 1777'
          "${compose[@]}" run --rm --no-deps reddock-backup create \
            --data-dir /var/lib/reddock --output /backups/ci.rdbackup --confirm-offline
          test "$(stat -c %a "$REDDOCK_BACKUP_DIR/ci.rdbackup")" = 600
          test "$(stat -c %u "$REDDOCK_BACKUP_DIR/ci.rdbackup")" = "$(id -u)"
          "${compose[@]}" run -T --rm --no-deps reddock-verify verify --archive - \
            < "$REDDOCK_BACKUP_DIR/ci.rdbackup"
          "${compose[@]}" run -T --rm --no-deps reddock-restore restore \
            --data-dir /var/lib/reddock --archive - --confirm-offline --confirm-replace \
            < "$REDDOCK_BACKUP_DIR/ci.rdbackup"
          "${compose[@]}" run --rm --no-deps --entrypoint sh reddock-recover -c \
            'test "$(stat -c %a /var/lib/reddock/reddock.db)" = 640 && test "$(stat -c %a /var/lib/reddock/evidence)" = 750'

          "${compose[@]}" run --rm --no-deps --entrypoint python reddock-recover -c '
          from pathlib import Path
          import shutil
          from app.backup import RESTORE_MARKER, _write_restore_marker
          data = Path("/var/lib/reddock")
          token = "1" * 32
          shutil.copy2(data / "reddock.db", data / f".reddock.db.rollback-{token}")
          shutil.copytree(data / "evidence", data / f".evidence.rollback-{token}")
          (data / f".restore-{token}").mkdir()
          _write_restore_marker(data / RESTORE_MARKER, {
              "schema": "reddock.restore/1", "token": token, "state": "committed",
              "had_database": True, "had_evidence": True,
          }, create=True)
          '
          if "${compose[@]}" run --rm --no-deps --entrypoint python reddock-recover \
            -c "from app.database import initialize_database; initialize_database()"; then
            echo "application startup unexpectedly accepted an incomplete restore" >&2
            exit 1
          fi
          "${compose[@]}" run --rm --no-deps reddock-recover recover \
            --data-dir /var/lib/reddock --confirm-offline --confirm-finalize

          docker run -d --name "$ready_container" --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            -v "${project}_reddock-data:/var/lib/reddock" reddock:ci
          for attempt in {1..20}; do
            if docker exec "$ready_container" python -c \
              "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/api/ready')"; then
              break
            fi
            if [ "$attempt" = 20 ]; then exit 1; fi
            sleep 2
          done
      - name: Prepare reviewed data-only detector manifest
        run: |
          mkdir -p "$RUNNER_TEMP/reddock-detectors"
          cp plugins/examples/example-server.json.example "$RUNNER_TEMP/reddock-detectors/example-server.json"
      - name: Start the production image with Phase 7 test gates
        run: |
          docker run -d --name reddock -p 127.0.0.1:8080:8080 \
            -e REDDOCK_LAB_MODE_ENABLED=true \
            -e REDDOCK_DETECTOR_PLUGIN_DIR=/etc/reddock/detectors \
            -v "$RUNNER_TEMP/reddock-detectors:/etc/reddock/detectors:ro" \
            reddock:ci
      - name: Wait for the health endpoint
        run: for attempt in {1..12}; do curl --fail http://localhost:8080/api/health && exit 0; sleep 2; done; exit 1
      - name: Full product smoke test
        # Both discovery profiles scan the container's own loopback only.
        env:
          REDDOCK_EXPECT_PLUGIN: "true"
        run: python3 scripts/smoke_test.py
      - if: always()
        run: docker logs reddock

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_DB: reddock
          POSTGRES_USER: reddock
          POSTGRES_PASSWORD: integration-only
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reddock -d reddock"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Prove migrations and CRUD against PostgreSQL
        env:
          REDDOCK_TEST_POSTGRES_URL: postgresql+psycopg://reddock:integration-only@127.0.0.1:5432/reddock
        run: pytest tests/test_postgres.py
